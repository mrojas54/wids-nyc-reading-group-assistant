[[package]]
name = "wids-nyc-reading-group-assistant"
version = "0.0.0"
source = { virtual = "." }
dependencies = [
    { name = "beautifulsoup4" },
    { name = "httpx" },
    { name = "numpy" },
    { name = "psycopg", extra = ["binary"] },
    { name = "pydantic" },
    { name = "pyzotero" },
    { name = "requests" },
    { name = "tenacity" },
]

[package.optional-dependencies]
ml = [
    { name = "adapters" },
    { name = "onnx" },
    { name = "onnxruntime" },
    { name = "optimum", extra = ["onnxruntime"] },
    { name = "torch" },
    { name = "transformers" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "responses" },
    { name = "respx" },
    { name = "ruff" },
    { name = "ty" },
]

[package.metadata]
requires-dist = [
    { name = "adapters", marker = "extra == 'ml'" },
    { name = "beautifulsoup4", specifier = ">=4.12" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "onnx", marker = "extra == 'ml'" },
    { name = "onnxruntime", marker = "extra == 'ml'" },
    { name = "optimum", extras = ["onnxruntime"], marker = "extra == 'ml'" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.2" },
    { name = "pydantic", specifier = ">=2.6" },
    { name = "pyzotero", specifier = ">=1.5" },
    { name = "requests", specifier = ">=2.31" },
    { name = "tenacity", specifier = ">=8.2" },
    { name = "torch", marker = "extra == 'ml'", specifier = ">=2.6" },
    { name = "transformers", marker = "extra == 'ml'" },
]
provides-extras = ["ml"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.0" },
    { name = "pytest-asyncio", specifier = ">=0.23" },
    { name = "responses", specifier = ">=0.25" },
    { name = "respx", specifier = ">=0.21" },
    { name = "ruff", specifier = ">=0.6" },
    { name = "ty", specifier = ">=0.0.46" },
]
