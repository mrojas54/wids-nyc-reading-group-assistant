# Continuous integration — runs the web and Python test suites on every PR
# and on pushes to main.
#
# Security note: every run: block references only static strings; no
# github.event.* inputs are interpolated, so this workflow is not exposed to
# script-injection per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web (lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # setup-node's `cache: npm` only restores the ~/.npm download cache, not
      # node_modules itself. @xenova/transformers + onnxruntime-web are large,
      # so caching the installed tree skips the slow extract/link phase on a hit.
      # npm ci still runs below — correct on a miss, and a fast reconcile on a
      # hit since the lockfile hash keys the cache.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

  python:
    # Display name kept as "python (pytest)" to match the required status check
    # in main's branch protection. The job now also runs ruff + ty (below).
    name: python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen asserts uv.lock is in sync with pyproject.toml (fails CI if a
      # dependency change forgot to re-lock); deps come from the committed lock,
      # so the env is reproducible across runs and machines.
      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Lint (ruff)
        run: uv run ruff check scripts tests

      - name: Type-check (ty)
        run: uv run ty check

      # scripts/pilot_cli.py is intentionally not collected — it is a live-DB
      # operator CLI (not a pytest module). It lives under scripts/ so a naive
      # `pytest tests` no longer tries to import it.
      - name: Run unit tests
        run: |
          uv run pytest -c tests/pytest.ini -v \
            tests/find_paper_suggest_test.py \
            tests/zotero_push_test.py \
            tests/build_arxiv_taxonomy_test.py \
            tests/render_email_previews_test.py \
            tests/quotes_select_test.py \
            tests/build_quotes_test.py

  edge-functions:
    name: edge-functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # Run from here so Deno auto-discovers deno.json (strict + lint config)
        # and the import map it wires via "importMap": "./import_map.json".
        working-directory: supabase/functions

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check '**/*.ts'

      - name: Lint Edge Functions
        run: deno lint
