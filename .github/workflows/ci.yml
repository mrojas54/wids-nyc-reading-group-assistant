# Continuous integration — runs the web and Python test suites on every PR
# and on pushes to main.
#
# Security note: every run: block references only static strings; no
# github.event.* inputs are interpolated, so this workflow is not exposed to
# script-injection per
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web (lint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # setup-node's `cache: npm` only restores the ~/.npm download cache, not
      # node_modules itself. @xenova/transformers + onnxruntime-web are large,
      # so caching the installed tree skips the slow extract/link phase on a hit.
      # npm ci still runs below — correct on a miss, and a fast reconcile on a
      # hit since the lockfile hash keys the cache.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # `--omit=dev` is a deliberate, temporary narrowing — remove it as soon
      # as the upstream fix below lands.
      #
      # GHSA-mh99-v99m-4gvg (brace-expansion, DoS via unbounded expansion) has
      # no reachable fix for us. The chain is:
      #
      #   eslint-config-next 16.2.11
      #     -> eslint-plugin-{import,react,jsx-a11y}  (latest published)
      #        -> minimatch ^3.1.2
      #           -> brace-expansion ^1.1.7 -> 1.1.16   (vulnerable)
      #
      # Every escape route was tried and each breaks the toolchain, because
      # all three hops changed their export shape at the patched major:
      #   * brace-expansion 1 -> 5: v1 exports a callable, v5 exports
      #     { EXPANSION_MAX, expand }. minimatch/minimatch.js:271 calls it
      #     directly -> "expand is not a function".
      #   * minimatch 3 -> 10: v3 sets module.exports = minimatch, v9+ export
      #     a named object. eslint-plugin-react calls minimatch(...) directly.
      #   * eslint 9 -> 10: cuts 9 advisories to 6 but eslint-config-next's
      #     bundled eslint-plugin-react calls context.getFilename(), removed in
      #     eslint 10 -> lint dies outright.
      # `npm audit fix` fixes none of them, and `npm audit fix --force`
      # proposes eslint-config-next@0.2.4 — a downgrade that breaks Next 16.
      #
      # Nothing here reaches the deployed app: this is lint tooling only, and
      # `--omit=dev` reports 0. That is what makes the narrowing acceptable
      # rather than a shrug — the gate still fails on any high in a package we
      # actually ship.
      #
      # REVERT WHEN: eslint-plugin-{import,react,jsx-a11y} move to minimatch@10
      # (which depends on brace-expansion ^5.0.5), or brace-expansion backports
      # a patched 1.1.x. Either arrives via a plain `npm install` — the caret
      # ranges float — so just drop `--omit=dev` and see if it stays green.
      - name: Audit dependencies (production only — see note above)
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

  python:
    # Display name kept as "python (pytest)" to match the required status check
    # in main's branch protection. The job now also runs ruff + ty (below).
    name: python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen asserts uv.lock is in sync with pyproject.toml (fails CI if a
      # dependency change forgot to re-lock); deps come from the committed lock,
      # so the env is reproducible across runs and machines.
      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Lint (ruff)
        run: uv run ruff check scripts tests

      - name: Type-check (ty)
        run: uv run ty check

      # Collect the whole tests/ tree so new *_test.py files gate automatically
      # (a hand-maintained file list silently dropped new tests in July 2026).
      # scripts/pilot_cli.py is a live-DB operator CLI, not a pytest module; it
      # lives under scripts/ so this collection never imports it.
      - name: Run unit tests
        run: uv run pytest -c tests/pytest.ini -v tests/

  edge-functions:
    name: edge-functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # Run from here so Deno auto-discovers deno.json (strict + lint config)
        # and the import map it wires via "importMap": "./import_map.json".
        working-directory: supabase/functions

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions
        run: deno check '**/*.ts'

      - name: Lint Edge Functions
        run: deno lint
