[project]
name = "wids-nyc-reading-group-assistant"
version = "0.0.0"
description = "Python helper scripts for the WiDS NYC reading-group assistant."
# 3.13 is both the floor and the only version CI exercises (ci.yml runs
# `uv sync --frozen --python 3.13`). Keeping the two in lockstep is deliberate:
# a floor lower than the tested version declares support that no gate verifies.
# Raise both together, or not at all.
#
# Exception, and do NOT "fix" it: the three SPECTER2 scripts and
# .github/workflows/export-specter2.yml stay pinned to `--python 3.11`. On 3.13
# uv's resolver silently falls back to an unrelated 2018 namesake package
# ('optimum 0.1.0') instead of HuggingFace optimum — a wrong-package failure, not
# a version error. Those scripts are meant to run standalone with the optional
# `ml` deps, never from this lock, so the floor here should not apply to them.
# See docs/admin-suggest.md § "Python and the ML stack".
#
# HOW that exception is enforced — this part is load-bearing, keep it in sync
# with the floor above. Those commands run from the repo root and invoke the
# interpreter (`uv run ... python scripts/foo.py`) rather than the script, so uv
# never reads the inline PEP 723 block and stays in project context. In project
# context the floor DOES apply and uv refuses outright:
#
#   error: The requested interpreter resolved to Python 3.11.11, which is
#   incompatible with the project's Python requirement: `>=3.13`
#
# So every one of those commands passes `--no-project`, which detaches it from
# this file. `--isolated` is NOT a substitute — it bypasses caches and config but
# still reads `project.requires-python`. If you raise the floor again, you do not
# need to touch the SPECTER2 commands, but you DO need to re-verify with:
#
#   uv run --no-project --python 3.11 python -c "import sys; print(sys.version)"
#
# run from the repo root. It must print 3.11.x, not an error.
requires-python = ">=3.13"

# Runtime dependencies of the maintained, CI-tested scripts. These were
# previously declared only as inline PEP 723 `# /// script` blocks and as
# `--with` flags in .github/workflows/ci.yml; this is now the single source
# of truth, pinned reproducibly via the committed uv.lock.
dependencies = [
    "beautifulsoup4>=4.12",   # scripts/build_arxiv_taxonomy.py
    "httpx>=0.27",            # find_paper_suggest, build_arxiv_taxonomy, collect_specter2_fixtures
    "numpy>=1.26",            # scripts/find_paper_suggest.py
    "psycopg[binary]>=3.2",   # scripts/zotero_push.py
    "pydantic>=2.6",          # scripts/find_paper_suggest.py
    "pyzotero>=1.5",          # scripts/zotero_push.py
    "requests>=2.31",         # scripts/zotero_push.py
    "tenacity>=8.2",          # scripts/find_paper_suggest.py
]

[project.optional-dependencies]
# Heavy, platform-specific SPECTER2 export/verification stack. Integration-only
# — intentionally NOT installed by `uv sync` (default groups) or CI. The exact
# per-platform invocations live in the module docstrings of
# scripts/{export,embed,verify}_specter2_*.py (Intel Mac pins differ).
ml = [
    "torch>=2.6",
    "transformers",
    "adapters",
    "optimum[onnxruntime]",
    "onnx",
    "onnxruntime",
]

[dependency-groups]
# Installed by `uv sync` and CI. Mirrors the test + lint + type toolchain.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21", # find_paper_suggest_test (httpx mocking)
    "responses>=0.25", # zotero_push_test (requests mocking)
    "ruff>=0.6",
    "ty>=0.0.46",
]

[tool.uv]
# Virtual project: this repo is a collection of scripts, not an installable
# package. Tests import `scripts` via repo-root on sys.path (see tests/conftest.py),
# so there is nothing to build or install.
package = false

[tool.ruff]
target-version = "py313"
# Demo teaching notebooks under web/public are published artifacts, not
# maintained source — their literate style (inline semicolons, re-imports)
# is deliberate. Excluding them keeps whole-repo `ruff check .` green.
extend-exclude = ["web/public/notebooks"]

[tool.ruff.lint.per-file-ignores]
# Tests use a deliberate literate style: a smoke `import` test runs first, then
# imports are interleaved between test functions. E402 is expected there and
# would otherwise mask genuine import-ordering bugs in non-test code.
"tests/*" = ["E402"]

[tool.ty.environment]
# Tracks `requires-python` above — ty resolves version-gated stdlib and typing
# behaviour against this, so a stale value type-checks the wrong language.
python-version = "3.13"

[tool.ty.src]
# Match the old mypy `files = ["scripts"]` scope. The three heavy SPECTER2
# scripts stay excluded — their torch/transformers/onnx deps live in the
# optional `ml` group and are never installed in CI, so checking them only
# surfaces unresolved-import cascades.
include = ["scripts"]
exclude = [
    "scripts/export_specter2_onnx.py",
    "scripts/embed_specter2_fp32.py",
    "scripts/verify_specter2_local_vs_s2.py",
]

[tool.ty.analysis]
# pyzotero ships no type information (was `ignore_missing_imports` under mypy).
# Global `[tool.ty.analysis]` table — the `[[tool.ty.overrides]]` array form is
# only needed for path-scoped rules, which we don't need here.
allowed-unresolved-imports = ["pyzotero.**"]
